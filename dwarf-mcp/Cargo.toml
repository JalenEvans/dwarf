[package]
name = "dwarf-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
dwarf-lib = { path = "../dwarf-lib" }
dwarf-gen = { path = "../dwarf-gen" }
rust-mcp-sdk = "0.10"
rust-mcp-schema = "0.10"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[lib]
name = "dwarf_mcp"
path = "src/lib.rs"

[[bin]]
name = "dwarf-mcp"
path = "src/main.rs"
