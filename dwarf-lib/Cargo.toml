[package]
name = "dwarf-lib"
version = "0.1.0"
edition = "2021"

[dependencies]
dwarf-syntax = { path = "../dwarf-syntax" }
dwarf-lexer = { path = "../dwarf-lexer" }
dwarf-parser = { path = "../dwarf-parser" }
dwarf-typecheck = { path = "../dwarf-typecheck" }
dwarf-mir = { path = "../dwarf-mir" }
dwarf-lir = { path = "../dwarf-lir" }
dwarf-emitter = { path = "../dwarf-emitter" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
