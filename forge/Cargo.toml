[package]
name = "forge"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
dwarf-cli = { path = "../dwarf-cli" }
dwarf-lib = { path = "../dwarf-lib" }
dwarf-syntax = { path = "../dwarf-syntax" }
dwarf-lexer = { path = "../dwarf-lexer" }
dwarf-parser = { path = "../dwarf-parser" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# DWARF-127: Wasm execution engine for the dUnit test runner.
wasmtime = "29"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
# Test-only: parse WAT text into Wasm module bytes for the wasmtime executor
# tests. The production wasmtime dependency belongs in [dependencies] and is
# added by the DWARF-127 implementation (not wired yet — RED phase).
wat = "1"
# DWARF-129: integration tests drive the WAT emitter directly to build modules
# for the wasmtime runner. These are test-only; production wiring goes through
# dwarf-lib's backend selection.
dwarf-emitter = { path = "../dwarf-emitter" }
dwarf-lir = { path = "../dwarf-lir" }
