[package]
name = "forge"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
dwarf-cli = { path = "../dwarf-cli" }
dwarf-syntax = { path = "../dwarf-syntax" }
dwarf-lexer = { path = "../dwarf-lexer" }
dwarf-parser = { path = "../dwarf-parser" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
