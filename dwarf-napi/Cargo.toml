[package]
name = "dwarf-napi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
dwarf-lib = { path = "../dwarf-lib" }
napi = { version = "3", features = ["default", "napi6", "serde-json"] }
napi-derive = "3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
napi-build = "2"
