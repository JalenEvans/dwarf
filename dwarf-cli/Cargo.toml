[package]
name = "dwarf-cli"
version = "0.1.0"
edition = "2021"

[lib]
name = "dwarf_cli"
path = "src/lib.rs"

[[bin]]
name = "dwarf-cli"
path = "src/main.rs"

[dependencies]
dwarf-syntax = { path = "../dwarf-syntax" }
dwarf-lexer = { path = "../dwarf-lexer" }
dwarf-parser = { path = "../dwarf-parser" }
dwarf-typecheck = { path = "../dwarf-typecheck" }
dwarf-mir = { path = "../dwarf-mir" }
dwarf-lir = { path = "../dwarf-lir" }
dwarf-emitter = { path = "../dwarf-emitter" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
notify = "7"

[dev-dependencies]
serde_json = "1"
