[package]
name = "dwarf-lsp"
version = "0.1.0"
edition = "2021"

[dependencies]
dwarf-lib = { path = "../dwarf-lib" }
dwarf-parser = { path = "../dwarf-parser" }
dwarf-syntax = { path = "../dwarf-syntax" }
lsp-server = "0.7"
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[lib]
name = "dwarf_lsp"
path = "src/lib.rs"

[[bin]]
name = "dwarf-lsp"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
